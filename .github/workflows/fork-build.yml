# Fork-friendly build: same toolchain/steps as build.yml, but no SSH keys
# and no deploy. Every target is uploaded as a downloadable artifact.
# Runs on pushes to any branch except master (so master can mirror
# upstream untouched) and on manual dispatch.
name: Fork build

on:
  push:
    branches-ignore: [ master ]
  workflow_dispatch:

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # slider test branch only: just the snapshot the Hatari test boots
          - { cpu_target: tt,      artifact: freemint-tt_falcon_clones }
    env:
      CROSS_TOOL: m68k-atari-mint
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup environment
        env:
          CPU_TARGET: ${{ matrix.cpu_target }}
        run: ./.scripts/setup_env.sh
      - name: Install packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYSROOT_DIR="/" ./.scripts/install-freemint.sh binutils gcc mintbin
          ./.scripts/install-freemint.sh mintlib fdlibm gemlib cflib gemma
          ./.scripts/install-hcp.sh
          ./.scripts/install-udo.sh
          ./.scripts/install-release.sh dosfstools e2fsprogs
      - name: Install Applications
        run: ./.scripts/install-apps.sh
      - name: libcmini
        run: ./.scripts/install-libcmini.sh
      - name: build
        run: |
          ./.scripts/before_script.sh
          ./.scripts/build.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/freemint-deploy
          retention-days: 30

  # Temporary (slider test branch only): boots the TT/Falcon snapshot in
  # Hatari and runs tests/hatari/slidetest (slider painting check).
  hatari-slidetest:
    needs: build
    runs-on: ubuntu-24.04
    env:
      CROSS_TOOL: m68k-atari-mint
    steps:
      - uses: actions/checkout@v6
      - name: Install cross compiler (for the test app)
        run: |
          SYSROOT_DIR="/" ./.scripts/install-freemint.sh binutils gcc mintbin
          ./.scripts/install-freemint.sh mintlib gemlib
      - name: Build test app
        run: make -C tests/hatari/slidetest
      - name: Install Hatari and EmuTOS
        run: ./tests/hatari/setup.sh
      - uses: actions/download-artifact@v6
        with:
          name: freemint-tt_falcon_clones
          path: snapshot
      - name: Run slider test
        run: HATARI_WORK="$PWD/hatari-out" ./tests/hatari/slidetest/run.sh "$(ls snapshot/*.zip | head -1)"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hatari-slidetest-results
          path: |
            hatari-out/shots
            hatari-out/hatari.log
            hatari-out/results.txt
          retention-days: 30
