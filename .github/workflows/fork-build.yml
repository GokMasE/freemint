# Fork-friendly build: same toolchain/steps as build.yml, but no SSH keys
# and no deploy. Every target is uploaded as a downloadable artifact.
# Runs on pushes to any branch except master (so master can mirror
# upstream untouched) and on manual dispatch.
name: Fork build

on:
  push:
    branches-ignore: [ master ]
  workflow_dispatch:

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cpu_target: "000",   artifact: freemint-cpu-000 }
          - { cpu_target: "02060", artifact: freemint-cpu-02060 }
          - { cpu_target: col,     artifact: freemint-cpu-coldfire }
          - { cpu_target: deb,     artifact: freemint-cpu-debug }
          - { cpu_target: prg,     artifact: usb4tos }
          - { cpu_target: ste,     artifact: freemint-st_ste }
          - { cpu_target: tt,      artifact: freemint-tt_falcon_clones }
          - { cpu_target: firebee, artifact: freemint-firebee }
          - { cpu_target: ara,     artifact: freemint-aranym }
    env:
      CROSS_TOOL: m68k-atari-mint
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup environment
        env:
          CPU_TARGET: ${{ matrix.cpu_target }}
        run: ./.scripts/setup_env.sh
      - name: Install packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYSROOT_DIR="/" ./.scripts/install-freemint.sh binutils gcc mintbin
          ./.scripts/install-freemint.sh mintlib fdlibm gemlib cflib gemma
          ./.scripts/install-hcp.sh
          ./.scripts/install-udo.sh
          ./.scripts/install-release.sh dosfstools e2fsprogs
      - name: Install Applications
        run: ./.scripts/install-apps.sh
      - name: libcmini
        run: ./.scripts/install-libcmini.sh
      - name: build
        run: |
          ./.scripts/before_script.sh
          ./.scripts/build.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/freemint-deploy
          retention-days: 30

  # Boots the TT/Falcon snapshot in Hatari (Falcon 030, EmuTOS, IDE disk)
  # and runs the XaAES input tests in tests/hatari. See tests/hatari/README.md.
  hatari-test:
    needs: build
    runs-on: ubuntu-24.04
    env:
      CROSS_TOOL: m68k-atari-mint
    steps:
      - uses: actions/checkout@v6
      - name: Install cross compiler (for the test app)
        run: |
          SYSROOT_DIR="/" ./.scripts/install-freemint.sh binutils gcc mintbin
          ./.scripts/install-freemint.sh mintlib gemlib
      - name: Build test app
        run: make -C tests/hatari/poptest
      - name: Install Hatari and EmuTOS
        run: ./tests/hatari/setup.sh
      - uses: actions/download-artifact@v6
        with:
          name: freemint-tt_falcon_clones
          path: snapshot
      - name: Run tests
        run: |
          ls -l snapshot
          HATARI_WORK="$PWD/hatari-out" ./tests/hatari/run-tests.sh "$(ls snapshot/*.zip | head -1)"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hatari-test-results
          path: |
            hatari-out/shots
            hatari-out/hatari.log
            hatari-out/results.txt
          retention-days: 30
